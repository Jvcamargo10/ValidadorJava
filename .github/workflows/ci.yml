name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: API (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build (javac, sem Maven/Gradle)
        run: ./build.sh
      - name: Testes (harness próprio, sem JUnit/Maven)
        run: ./test.sh

  frontend:
    name: Front-end (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Build (Vite -> ../docs)
        run: npm run build
